name: Android app

# Builds the ShilpiKala Android app (android/) and attaches the results to
# the run's "Artifacts" section:
#   shilpikala-release.aab  -> upload this to Google Play
#   shilpikala-release.apk  -> install directly on a phone to test
# Without the signing secrets it builds a debug APK only.
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias (shilpikala-upload)
#   ANDROID_KEY_PASSWORD       key password

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown in Play Store (e.g. 1.0.1)"
        required: false
        default: "1.0.0"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        id: signing
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets set: building a debug APK only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release (AAB + APK)
        if: steps.signing.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease assembleRelease
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab out/shilpikala-release.aab
          cp app/build/outputs/apk/release/app-release.apk out/shilpikala-release.apk
          {
            echo "### ShilpiKala ${VERSION_NAME} (version code ${VERSION_CODE})"
            echo
            echo "Upload key SHA-256 (for ANDROID_SHA256_CERT_FINGERPRINTS on the website):"
            echo '```'
            keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep 'SHA256:' | awk '{print $2}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: |
          ./gradlew --no-daemon assembleDebug
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/shilpikala-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shilpikala-android-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: android/out/*
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
